name: notebook-tests

# Execute le notebook de bout en bout : toute assertion cassee (sections
# XII a XXV) fait echouer le job.

on:
  push:
  pull_request:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jupyter nbconvert ipykernel

      - name: Execute notebook (all assertions)
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1500 \
            jiyufit_modele_concurrentiel.ipynb \
            --output executed.ipynb --output-dir /tmp
